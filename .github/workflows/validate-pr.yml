name: Validate action on PR

on:
  push:
    branches:
      - triage-open-issues
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Run unit tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  run-local-action:
    runs-on: ubuntu-latest
    name: Run action from branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./
        name: Load used actions for current org
        id: load-actions
        with:
          PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate output
        shell: bash
        env:
          ACTIONS_FILE: ${{ steps.load-actions.outputs.actions-file }}
        run: |
          echo "Actions file: $ACTIONS_FILE"
          if [ ! -f "$ACTIONS_FILE" ]; then
            echo "::error::Output file not found"
            exit 1
          fi
          count=$(jq '. | length' "$ACTIONS_FILE")
          echo "Found ${count} unique actions"
          if [ "${count}" -le 0 ]; then
            echo "::error::No actions found in output"
            exit 1
          fi
          echo "### Action validation passed: ${count} unique actions found" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload result as artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: used-actions-${{ github.run_id }}
          path: used-actions.json
