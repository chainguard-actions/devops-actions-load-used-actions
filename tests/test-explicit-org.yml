name: Test explicit organization input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Explicitly pass the organization (same as the repo owner)
          organization: ${{ github.repository_owner }}
          PAT: ${{ github.token }}

      - name: Check action outcome and validate outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTIONS_FILE: ${{ steps.action.outputs.actions-file }}
        run: |
          echo "Action outcome: $OUTCOME"
          echo "actions-file output: $ACTIONS_FILE"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: validate the output file
            if [ -z "$ACTIONS_FILE" ]; then
              echo "FAIL: action succeeded but actions-file output is empty"
              exit 1
            fi

            FULL_PATH="$GITHUB_WORKSPACE/$ACTIONS_FILE"
            echo "Checking for file at: $FULL_PATH"
            if [ ! -f "$FULL_PATH" ]; then
              echo "FAIL: expected file '$FULL_PATH' does not exist"
              exit 1
            fi

            CONTENT=$(cat "$FULL_PATH")
            echo "File content (first 500 chars): ${CONTENT:0:500}"
            if ! echo "$CONTENT" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
              echo "FAIL: file content is not valid JSON"
              exit 1
            fi
            echo "PASS: action succeeded and output file contains valid JSON"
          else
            # Action failed: this is acceptable when the token has limited org access
            # or when the org has no repos with workflow files using actions.
            echo "Action did not succeed (outcome=$OUTCOME). This is acceptable when:"
            echo "  - The GITHUB_TOKEN does not have org-level repo listing access"
            echo "  - The org has no repos with workflow files using GitHub Actions"
            echo "PASS: action failed gracefully as expected under limited token access"
          fi
