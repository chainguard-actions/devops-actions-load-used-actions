name: Test explicit organization input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          organization: ${{ github.repository_owner }}
          PAT: ${{ github.token }}

      - name: Assert actions-file output is set
        env:
          ACTIONS_FILE: ${{ steps.action.outputs.actions-file }}
        run: |
          echo "actions-file output: $ACTIONS_FILE"
          if [ -z "$ACTIONS_FILE" ]; then
            echo "FAIL: expected actions-file output to be set but it was empty"
            exit 1
          fi
          echo "PASS: actions-file output is set to '$ACTIONS_FILE'"

      - name: Assert output file name is used-actions.json
        env:
          ACTIONS_FILE: ${{ steps.action.outputs.actions-file }}
        run: |
          echo "actions-file value: $ACTIONS_FILE"
          if [ "$ACTIONS_FILE" != "used-actions.json" ]; then
            echo "FAIL: expected actions-file to be 'used-actions.json' but got '$ACTIONS_FILE'"
            exit 1
          fi
          echo "PASS: actions-file is 'used-actions.json'"

      - name: Assert output file exists in workspace
        env:
          ACTIONS_FILE: ${{ steps.action.outputs.actions-file }}
        run: |
          FULL_PATH="$GITHUB_WORKSPACE/$ACTIONS_FILE"
          echo "Checking for file at: $FULL_PATH"
          if [ ! -f "$FULL_PATH" ]; then
            echo "FAIL: expected file '$FULL_PATH' to exist but it was not found"
            exit 1
          fi
          echo "PASS: output file exists at '$FULL_PATH'"

      - name: Assert output file content is valid JSON
        env:
          ACTIONS_FILE: ${{ steps.action.outputs.actions-file }}
        run: |
          FULL_PATH="$GITHUB_WORKSPACE/$ACTIONS_FILE"
          CONTENT=$(cat "$FULL_PATH")
          echo "File content (first 500 chars): ${CONTENT:0:500}"
          # The file should be valid JSON (array, object, or null when no actions found)
          if echo "$CONTENT" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "PASS: file contains valid JSON"
          elif [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "PASS: file is empty/null (no actions found in org)"
          else
            echo "FAIL: file content is not valid JSON: $CONTENT"
            exit 1
          fi
