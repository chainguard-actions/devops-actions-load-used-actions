name: Test default organization - uses GITHUB_REPOSITORY_OWNER when org not specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY_OWNER: devops-actions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: load-actions
        uses: .
        with:
          PAT: ${{ github.token }}
        # organization is not specified - should default to GITHUB_REPOSITORY_OWNER

      - name: Assert actions-file output is set
        env:
          ACTIONS_FILE: ${{ steps.load-actions.outputs.actions-file }}
        run: |
          echo "actions-file output: $ACTIONS_FILE"
          if [ -z "$ACTIONS_FILE" ]; then
            echo "FAIL: actions-file output is empty"
            exit 1
          fi
          echo "PASS: actions-file output is set to '$ACTIONS_FILE'"

      - name: Assert output file exists in workspace
        env:
          ACTIONS_FILE: ${{ steps.load-actions.outputs.actions-file }}
        run: |
          FULL_PATH="$GITHUB_WORKSPACE/$ACTIONS_FILE"
          echo "Checking for file at: $FULL_PATH"
          if [ ! -f "$FULL_PATH" ]; then
            echo "FAIL: expected file '$FULL_PATH' not found"
            exit 1
          fi
          echo "PASS: file exists at $FULL_PATH"

      - name: Assert output file has expected filename
        env:
          ACTIONS_FILE: ${{ steps.load-actions.outputs.actions-file }}
        run: |
          echo "actions-file value: $ACTIONS_FILE"
          if [ "$ACTIONS_FILE" != "used-actions.json" ]; then
            echo "FAIL: expected actions-file to be 'used-actions.json', got '$ACTIONS_FILE'"
            exit 1
          fi
          echo "PASS: actions-file output matches expected filename 'used-actions.json'"
