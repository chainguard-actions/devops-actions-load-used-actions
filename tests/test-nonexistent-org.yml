name: Test nonexistent organization fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          organization: this-org-does-not-exist-zq9x7k3m2p1
          PAT: ${{ github.token }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.actions-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actions-file: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent org/user"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: no output expected"
            exit 1
          fi
          echo "PASS"
