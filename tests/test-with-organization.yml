name: Test load used actions with explicit organization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: load-actions
        uses: .
        with:
          organization: devops-actions
          PAT: ${{ github.token }}

      - name: Assert actions-file output is set
        env:
          ACTIONS_FILE: ${{ steps.load-actions.outputs.actions-file }}
        run: |
          echo "actions-file output: $ACTIONS_FILE"
          if [ -z "$ACTIONS_FILE" ]; then
            echo "FAIL: actions-file output is empty"
            exit 1
          fi
          echo "PASS: actions-file output is set to '$ACTIONS_FILE'"

      - name: Assert actions-file exists in workspace
        env:
          ACTIONS_FILE: ${{ steps.load-actions.outputs.actions-file }}
        run: |
          FULL_PATH="$GITHUB_WORKSPACE/$ACTIONS_FILE"
          echo "Checking for file at: $FULL_PATH"
          if [ ! -f "$FULL_PATH" ]; then
            echo "FAIL: expected file not found at $FULL_PATH"
            exit 1
          fi
          echo "PASS: file exists at $FULL_PATH"

      - name: Assert actions-file contains valid JSON
        env:
          ACTIONS_FILE: ${{ steps.load-actions.outputs.actions-file }}
        run: |
          FULL_PATH="$GITHUB_WORKSPACE/$ACTIONS_FILE"
          echo "Checking JSON content of: $FULL_PATH"
          cat "$FULL_PATH"
          if ! python3 -c "import json,sys; json.load(open('$FULL_PATH'))" 2>/dev/null; then
            echo "FAIL: file does not contain valid JSON"
            exit 1
          fi
          echo "PASS: file contains valid JSON"

      - name: Assert output filename is used-actions.json
        env:
          ACTIONS_FILE: ${{ steps.load-actions.outputs.actions-file }}
        run: |
          echo "actions-file: $ACTIONS_FILE"
          if [ "$ACTIONS_FILE" != "used-actions.json" ]; then
            echo "FAIL: expected 'used-actions.json' but got '$ACTIONS_FILE'"
            exit 1
          fi
          echo "PASS: output filename is 'used-actions.json'"
