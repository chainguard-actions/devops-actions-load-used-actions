name: Test error handling - missing PAT should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: load-actions
        uses: .
        continue-on-error: true
        with:
          organization: devops-actions
          PAT: ""

      - name: Assert action failed when PAT is empty
        env:
          OUTCOME: ${{ steps.load-actions.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PAT is empty, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when PAT is empty"
